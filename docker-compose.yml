services:
  redis:
    image: redis:7-alpine
    container_name: collab-redis-cluster
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  server1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: collab-server-1
    environment:
      - PORT=4000
      - HOST=0.0.0.0
      - REDIS_URL=redis://redis:6379
      - INSTANCE_ID=server-1
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  server2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: collab-server-2
    environment:
      - PORT=4000
      - HOST=0.0.0.0
      - REDIS_URL=redis://redis:6379
      - INSTANCE_ID=server-2
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: collab-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server1
      - server2
    restart: unless-stopped

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    container_name: collab-toxiproxy
    ports:
      - "8474:8474" # API port
      - "8475:8475" # Proxied traffic port
    depends_on:
      - nginx
    restart: unless-stopped
